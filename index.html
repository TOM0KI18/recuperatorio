<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Directorio de Contactos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h3>Examen Recuperatorio</h3>
    <!-- Escribe aquí todo tu HTML -->
    <main class="card">
      <h1>Directorio de Contactos</h1>

      <form id="form-contacto" autocomplete="off">
        <input type="text" id="nombre" placeholder="Nombre" />
        <input type="text" id="telefono" placeholder="Teléfono" />
        <button type="submit" id="btn-agregar">Agregar</button>
      </form>

      <input type="text" id="buscador" placeholder="Buscar contacto por nombre..." />

      <p id="mensaje-vacio">Todavia no agregaste contactos.</p>

      <ul id="lista-contactos"></ul>

      <hr />

      <p id="contador">Contactos: 0</p>
    </main>  
    <script src="script.js"></script>
  </body>
</html>
